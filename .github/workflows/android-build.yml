name: Build Android Release APKs (User & Admin App)

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apks:
    name: Build & Package Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.5'
          channel: 'stable'
          cache: true

      - name: Resolve Workspace Dependencies
        run: |
          cd packages/design_system && flutter pub get && cd ../..
          cd packages/shared_core && flutter pub get && cd ../..
          cd packages/data_layer && flutter pub get && cd ../..
          cd apps/user_app && flutter pub get && cd ../..
          cd apps/admin_app && flutter pub get && cd ../..

      - name: Static Code Analysis
        run: |
          flutter analyze --no-fatal-infos packages/data_layer apps/user_app apps/admin_app

      - name: Run Authentication Persistence & Unit Tests
        env:
          SUPABASE_TEST_EMAIL: ${{ secrets.SUPABASE_TEST_EMAIL }}
          SUPABASE_TEST_PASSWORD: ${{ secrets.SUPABASE_TEST_PASSWORD }}
        run: |
          mkdir -p reports
          echo "==========================================" > reports/auth-diagnostics-summary.txt
          echo "Rankearn Authentication & Diagnostics Report" >> reports/auth-diagnostics-summary.txt
          echo "Execution Date: $(date -u)" >> reports/auth-diagnostics-summary.txt
          echo "==========================================" >> reports/auth-diagnostics-summary.txt

          echo "Running Data Layer Session Persistence Tests..."
          cd packages/data_layer
          flutter test test/auth_session_persistence_test.dart --reporter expanded 2>&1 | tee ../../reports/auth-persistence-tests.log
          flutter test test/data_layer_test.dart --reporter expanded 2>&1 | tee -a ../../reports/data-layer-tests.log
          flutter test test/supabase_real_auth_integration_test.dart --reporter expanded 2>&1 | tee -a ../../reports/supabase-real-auth-tests.log
          cd ../..

          echo "Running User App Auth Screen & Battle Flow Tests..."
          cd apps/user_app
          flutter test test/auth_screen_test.dart --reporter expanded 2>&1 | tee ../../reports/user-auth-screen-tests.log
          flutter test test/battle_flow_test.dart --reporter expanded 2>&1 | tee ../../reports/user-battle-tests.log
          cd ../..

          cat reports/auth-persistence-tests.log >> reports/auth-diagnostics-summary.txt
          cat reports/supabase-real-auth-tests.log >> reports/auth-diagnostics-summary.txt
          cat reports/user-auth-screen-tests.log >> reports/auth-diagnostics-summary.txt

      - name: Build User App Release APKs (Compact & Universal)
        run: |
          cd apps/user_app
          flutter build apk --release --split-per-abi --android-skip-build-dependency-validation
          flutter build apk --release --android-skip-build-dependency-validation

      - name: Build Admin App Release APKs (Compact & Universal)
        run: |
          cd apps/admin_app
          flutter build apk --release --split-per-abi --android-skip-build-dependency-validation
          flutter build apk --release --android-skip-build-dependency-validation

      - name: Organize APK Artifacts
        run: |
          mkdir -p release-apks
          # User App (Compact arm64 for 99% phones + Universal for all devices)
          cp apps/user_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-apks/rankearn-user-app-arm64.apk
          cp apps/user_app/build/app/outputs/flutter-apk/app-release.apk release-apks/rankearn-user-app-universal.apk

          # Admin App (Compact arm64 for 99% phones + Universal for all devices)
          cp apps/admin_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-apks/rankearn-admin-app-arm64.apk
          cp apps/admin_app/build/app/outputs/flutter-apk/app-release.apk release-apks/rankearn-admin-app-universal.apk

          echo "Generated APK Sizes:"
          ls -lh release-apks/

      - name: Upload User App Compact APK (arm64 - ~18MB)
        uses: actions/upload-artifact@v4
        with:
          name: rankearn-user-app-compact-arm64
          path: release-apks/rankearn-user-app-arm64.apk

      - name: Upload Admin App Compact APK (arm64 - ~18MB)
        uses: actions/upload-artifact@v4
        with:
          name: rankearn-admin-app-compact-arm64
          path: release-apks/rankearn-admin-app-arm64.apk

      - name: Upload All Release APKs (Compact & Universal)
        uses: actions/upload-artifact@v4
        with:
          name: rankearn-all-release-apks
          path: release-apks/*.apk

      - name: Upload Authentication Diagnostics & Test Reports
        uses: actions/upload-artifact@v4
        with:
          name: auth-diagnostics-and-test-reports
          path: reports/

      - name: Publish GitHub Release (on tag or manual dispatch)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release-apks/*.apk
          generate_release_notes: true
