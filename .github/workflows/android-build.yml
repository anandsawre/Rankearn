name: Build Android Release APKs (User & Admin App)

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apks:
    name: Build & Package Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Resolve Workspace Dependencies
        run: |
          cd packages/design_system && flutter pub get && cd ../..
          cd packages/shared_core && flutter pub get && cd ../..
          cd packages/data_layer && flutter pub get && cd ../..
          cd apps/user_app && flutter pub get && cd ../..
          cd apps/admin_app && flutter pub get && cd ../..

      - name: Build User App Release APK
        run: |
          cd apps/user_app
          flutter build apk --release

      - name: Build Admin App Release APK
        run: |
          cd apps/admin_app
          flutter build apk --release

      - name: Organize APK Artifacts
        run: |
          mkdir -p release-apks
          cp apps/user_app/build/app/outputs/flutter-apk/app-release.apk release-apks/rankearn-user-app-release.apk
          cp apps/admin_app/build/app/outputs/flutter-apk/app-release.apk release-apks/rankearn-admin-app-release.apk

      - name: Upload User App APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rankearn-user-app-release
          path: release-apks/rankearn-user-app-release.apk

      - name: Upload Admin App APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rankearn-admin-app-release
          path: release-apks/rankearn-admin-app-release.apk

      - name: Upload All Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: rankearn-release-apks
          path: release-apks/*.apk

      - name: Publish GitHub Release (on tag or manual dispatch)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release-apks/*.apk
          generate_release_notes: true
