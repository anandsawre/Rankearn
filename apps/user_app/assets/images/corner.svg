  <!-- Decorative droplets -->
  <circle cx="940" cy="132" r="13" fill="url(#dot)" opacity=".9"/>
  <circle cx="970" cy="170" r="7" fill="url(#dot)" opacity=".85"/>
  <circle cx="1345" cy="335" r="16" fill="url(#dot)" opacity=".82"/>
  <circle cx="1385" cy="370" r="8" fill="url(#dot)" opacity=".78"/>
</svg>
