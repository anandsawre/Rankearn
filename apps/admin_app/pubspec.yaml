name: admin_app
description: "Rankearn Flutter Admin Management Portal Application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  design_system:
    path: ../../packages/design_system
  shared_core:
    path: ../../packages/shared_core
  data_layer:
    path: ../../packages/data_layer
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  shared_preferences: ^2.5.6
  shared_preferences_android: 2.4.27
  supabase_flutter: ^2.8.0
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: Noto Sans Devanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Variable.ttf
